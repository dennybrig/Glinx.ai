name: Verify discovery prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: glinx --version
      - name: Verify installed package includes the dashboard
        working-directory: ${{ runner.temp }}
        run: python -c "from glinx_discovery.server import web_dir; assert (web_dir() / 'demo.json').exists()"
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
