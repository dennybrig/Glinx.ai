[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glinx-discovery"
version = "0.1.0"
description = "The sensing layer for a living model of the enterprise."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
glinx = "glinx_discovery.cli:main"

[tool.setuptools]
packages = ["glinx_discovery"]
include-package-data = true

[tool.setuptools.package-data]
glinx_discovery = ["web/*"]
